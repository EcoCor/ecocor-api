name: ecocor
services:
  api:
    image: "ecocor/api"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - EXIST_PASSWORD=
      - ECOCOR_API_BASE=http://localhost:8090/exist/restxq/ecocor
      - EXTRACTOR_SERVER=http://extractor
    ports:
      - "8090:8080"
  extractor:
    image: "ecocor/extractor"
    build: https://github.com/dh-network/ecocor-extractor.git#main
    ports:
      - "8040:80"
